name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify signed annotated tag
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r '.object.type' <<<"$ref_json")" = "tag" || {
            echo "Release tags must be annotated tag objects." >&2
            exit 1
          }
          tag_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          test "$(jq -r '.verification.verified' <<<"$tag_json")" = "true" || {
            echo "Release tag signature is not verified by GitHub." >&2
            exit 1
          }
          test "$(jq -r '.object.type' <<<"$tag_json")" = "commit" || {
            echo "Release tag must point directly to a commit." >&2
            exit 1
          }
          commit_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          echo "commit_sha=$commit_sha" >>"$GITHUB_OUTPUT"

      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.provenance.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require commit on main with successful exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.provenance.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
            echo "The tagged commit is not contained in origin/main." >&2
            exit 1
          }
          runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$TAG_COMMIT" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=100)"
          jq -e --arg sha "$TAG_COMMIT" \
            '.workflow_runs | any(.head_sha == $sha and .event == "push" and .conclusion == "success")' \
            <<<"$runs" >/dev/null || {
              echo "No successful main-branch CI run exists for $TAG_COMMIT." >&2
              exit 1
            }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: ""

      - name: Run release test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -v

      - name: Verify release version and build
        run: python scripts/build_release.py --version "$GITHUB_REF_NAME"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: professional-kanban-${{ github.ref_name }}
          path: |
            dist/professional-kanban.skill
            dist/professional-kanban.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: verify-and-build
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: professional-kanban-${{ github.ref_name }}
          path: dist

      - name: Verify checksums after transfer
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/professional-kanban.skill
            dist/professional-kanban.zip
            dist/SHA256SUMS

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/professional-kanban.skill \
            dist/professional-kanban.zip \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
