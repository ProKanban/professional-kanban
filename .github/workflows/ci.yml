name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""
      - name: Run complete test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -v
      - name: Compile packaged scripts outside the worktree
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/professional-kanban-pycache
        run: python -m compileall -q skills/professional-kanban/scripts scripts
      - name: Confirm tests and compilation did not modify tracked files
        run: git diff --exit-code

  distribution:
    name: Distribution and ecosystem validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: ""
      - name: Validate licensing
        run: |
          python -m pip install 'reuse[charset-normalizer]==6.2.0'
          reuse lint
      - name: Validate with GitHub Skills when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh skill publish --help >/dev/null 2>&1; then
            gh skill publish --dry-run
            install_dir="${{ runner.temp }}/installed-skill"
            gh skill install . professional-kanban --from-local --dir "$install_dir"
            test -f "$install_dir/professional-kanban/SKILL.md"
          else
            echo "gh skill preview is not available on this runner; static skill tests passed."
          fi
      - name: Validate with Claude CLI when available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "Claude CLI is not available on this runner; manifest tests passed."
          fi
      - name: Build twice and compare every artifact
        run: |
          first_dir="${{ runner.temp }}/release-one"
          second_dir="${{ runner.temp }}/release-two"
          python scripts/build_release.py --output "$first_dir"
          python scripts/build_release.py --output "$second_dir"
          cmp "$first_dir/professional-kanban.zip" "$second_dir/professional-kanban.zip"
          cmp "$first_dir/professional-kanban.skill" "$second_dir/professional-kanban.skill"
          cmp "$first_dir/SHA256SUMS" "$second_dir/SHA256SUMS"
          cd "$first_dir"
          sha256sum --check SHA256SUMS
      - name: Confirm validation did not modify tracked files
        run: git diff --exit-code
